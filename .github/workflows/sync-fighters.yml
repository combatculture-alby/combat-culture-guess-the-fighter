name: Refresh fighter roster from Google Sheets

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighter-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh roster
        env:
          FIGHTER_FEED_URL: ${{ secrets.FIGHTER_FEED_URL }}
        run: |
          if [ -z "$FIGHTER_FEED_URL" ]; then
            echo "Roster sync not configured yet. Add FIGHTER_FEED_URL to Actions secrets."
            exit 0
          fi
          python scripts/sync_fighters.py
      - name: Commit changes if needed
        run: |
          git add data/fighters.json data/daily-picks.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git config user.name "combat-culture-roster-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh fighter roster and daily puzzles"
            git push
          fi
