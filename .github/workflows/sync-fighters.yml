name: Refresh fighter roster from Google Sheets

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-fighters.yml'

permissions:
  contents: write

concurrency:
  group: fighter-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Google feed response
        env:
          FIGHTER_FEED_URL: 'https://script.google.com/macros/s/AKfycbwdg5hh-fRgs_eUadis_7hG01IVZLnNOgGeDijxdiN6gfDdmGxRUjbEe3N2b6A7XBr02w/exec'
        run: |
          python - <<'PY'
          import os, urllib.request
          with urllib.request.urlopen(os.environ["FIGHTER_FEED_URL"], timeout=45) as response:
              prefix = response.read(500)
              print("HTTP status:", response.status)
              print("Content type:", response.headers.get("Content-Type"))
              print("Response preview:", repr(prefix[:300].decode("utf-8", "replace")))
          PY
      - name: Refresh roster
        env:
          FIGHTER_FEED_URL: 'https://script.google.com/macros/s/AKfycbwdg5hh-fRgs_eUadis_7hG01IVZLnNOgGeDijxdiN6gfDdmGxRUjbEe3N2b6A7XBr02w/exec'
        run: python scripts/sync_fighters.py
      - name: Commit changes if needed
        run: |
          git add data/fighters.json data/daily-picks.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git config user.name "combat-culture-roster-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh fighter roster and daily puzzles"
            git push
          fi
