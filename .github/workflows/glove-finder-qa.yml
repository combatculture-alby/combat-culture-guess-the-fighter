name: Glove Finder QA

on:
  push:
    paths:
      - "glove-finder/index.html"
      - "glove-finder/qa.js"
      - ".github/workflows/glove-finder-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all Glove Finder scenarios
        run: node glove-finder/qa.js
